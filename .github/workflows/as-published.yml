# As-published archive ingest (ADR-010, sailscoring#283).
#
# On every push to main: rebuild the catalogue, re-emit the config, check both
# are committed and current, regenerate the ingest documents, and push them to
# the production workspace. Ingest is idempotent — the server no-ops unchanged
# documents by content hash — so this can run on every push without churn. The
# idempotency key is the document, though, so a render-only change in the app
# doesn't re-publish; dispatch manually with `force` to re-apply after one.
#
# Checkout layout matters: this repo's scripts reuse the app's archive-kit by
# relative import (`../../sailscoring/lib/archive-kit/…`), so the app must be a
# *sibling* directory, not a subdirectory of this one.
#
#   $GITHUB_WORKSPACE/ksc-archive   this repo
#   $GITHUB_WORKSPACE/sailscoring   the app
#
# Secrets:
#   APP_REPO_TOKEN              read access to sailscoring/sailscoring
#   SAILSCORING_ARCHIVIST_TOKEN the ksc workspace's archivist API key
#                               (workspace- and capability-scoped: it can only
#                               write as-published series)
#
# NOTE: not armed. Every step that needs the app is gated on APP_REPO_TOKEN, so
# until that secret exists the job succeeds having done nothing rather than
# failing red. The remaining step before arming is the ksc workspace itself,
# and the archivist token scoped to it.
name: as-published

on:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'as-published.config.json'
      - 'as-published-skips.json'
      - 'scripts/**'
      - '.github/workflows/as-published.yml'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Re-apply every document even if unchanged. Needed after an app-side
          render change: ingest is idempotent on the document hash, so a
          render-only change (which leaves the document identical) won't
          otherwise re-publish the pages.
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      # The `secrets` context isn't available in `if:` expressions, so the
      # gates below test the secrets through the job env instead: unset
      # secret -> empty env var -> step skipped.
      APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
      SAILSCORING_TOKEN: ${{ secrets.SAILSCORING_ARCHIVIST_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ksc-archive

      - name: Report that the ingest is not armed
        if: env.APP_REPO_TOKEN == ''
        run: |
          echo "APP_REPO_TOKEN is not configured — skipping the ingest." >> "$GITHUB_STEP_SUMMARY"
          echo "See the note at the top of .github/workflows/as-published.yml." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.APP_REPO_TOKEN != ''
        with:
          repository: sailscoring/sailscoring
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: sailscoring

      - uses: pnpm/action-setup@v6
        if: env.APP_REPO_TOKEN != ''
        with:
          package_json_file: sailscoring/package.json

      - uses: actions/setup-node@v7
        if: env.APP_REPO_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sailscoring/pnpm-lock.yaml

      - name: Install archive dependencies
        if: env.APP_REPO_TOKEN != ''
        working-directory: ksc-archive
        run: pnpm install --frozen-lockfile

      - name: Install app dependencies
        if: env.APP_REPO_TOKEN != ''
        working-directory: sailscoring
        run: pnpm install --frozen-lockfile

      - name: Rebuild the catalogue
        if: env.APP_REPO_TOKEN != ''
        working-directory: ksc-archive
        run: pnpm catalog

      - name: Emit the as-published config
        if: env.APP_REPO_TOKEN != ''
        working-directory: ksc-archive
        run: pnpm emit-as-published

      # The committed catalogue and config are the reviewable artifacts: if a
      # source change moves them, that should be committed, not applied
      # silently on the way past.
      - name: Catalogue and config are committed and current
        if: env.APP_REPO_TOKEN != ''
        working-directory: ksc-archive
        run: git diff --exit-code sources/catalog.json as-published.config.json as-published-skips.json

      - name: Generate ingest documents
        if: env.APP_REPO_TOKEN != ''
        working-directory: sailscoring
        run: pnpm archive-generate ../ksc-archive/as-published.config.json

      - name: Push to the workspace
        if: env.APP_REPO_TOKEN != '' && env.SAILSCORING_TOKEN != ''
        working-directory: sailscoring
        run: pnpm cli as-published push ../ksc-archive/as-published --workspace ksc ${{ inputs.force && '--force' || '' }}
